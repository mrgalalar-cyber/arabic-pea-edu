<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#0b4150" />
  <title>منصة التعلّم العربية</title>
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <script>
    // تطبيق الوضع المحفوظ قبل أول رسم لتفادي الوميض
    (function () {
      var t = "system";
      try { t = localStorage.getItem("theme") || "system"; } catch (e) {}
      var dark = t === "dark" || (t === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
